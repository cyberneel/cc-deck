# Polymux via Docker — works the same on Windows, macOS, and Linux.
#
# 1. Set a password + secret (create a .env next to this file):
#      POLYMUX_PASSWORD=choose-one
#      POLYMUX_SECRET=<64 hex chars>      # `openssl rand -hex 32`
# 2. Point the workspace volume below at the code you want sessions to work in.
# 3. `docker compose up -d`, then log the CLIs in once:
#      docker compose exec polymux claude      # then /login
#      docker compose exec polymux codex login
# 4. Open http://127.0.0.1:8787
services:
  polymux:
    build: .
    restart: unless-stopped
    # Host-only by default. Drop the 127.0.0.1 prefix only behind your own auth layer.
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      POLYMUX_PASSWORD: ${POLYMUX_PASSWORD:?set POLYMUX_PASSWORD in a .env}
      POLYMUX_SECRET: ${POLYMUX_SECRET:?set POLYMUX_SECRET (openssl rand -hex 32) in a .env}
      POLYMUX_ROOTS: /workspace
      # Optional extras (see .env.example):
      # POLYMUX_PERMISSION_MODE: auto
    volumes:
      # Your projects — edit the left side to your code directory (Windows: C:\path\to\code).
      - ./workspace:/workspace
      # Persists CLI auth (~/.claude, ~/.codex) + Polymux notes/restore across restarts.
      - ccdeck-home:/home/node
volumes:
  ccdeck-home:
