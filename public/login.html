<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Polymux" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <title>Sign in to Polymux</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;1,400&family=Martian+Mono:wght@300;400&display=swap" />
  <link rel="stylesheet" href="/login.css" />
</head>
<body>
  <form class="login" id="form">
    <div class="brand"><span class="dot"></span> Polymux</div>
    <p class="sub">Sign in to manage your Deep Sessions</p>
    <input type="password" id="password" placeholder="Password" autofocus autocomplete="current-password" />
    <button type="submit" class="primary">Sign in</button>
    <div class="error" id="error"></div>
    <a class="sso" id="sso" target="_top" hidden>Sign in with your FridayOS account</a>
  </form>
  <script>
    const form = document.getElementById('form');
    const err = document.getElementById('error');
    fetch('/api/login/sso').then((r) => r.json()).then(({ url }) => {
      if (!url) return;
      const a = document.getElementById('sso');
      a.href = url; a.hidden = false;
    }).catch(() => {});
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('password').value }),
      });
      if (res.ok) { location.href = '/'; }
      else { err.textContent = 'Invalid password'; }
    });
  </script>
</body>
</html>
