<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cc-deck · login</title>
  <meta name="color-scheme" content="dark" />
  <link rel="stylesheet" href="/login.css" />
</head>
<body>
  <form class="login" id="form">
    <div class="brand"><span class="dot"></span> cc-deck</div>
    <p class="sub">Sign in to manage your Claude sessions</p>
    <input type="password" id="password" placeholder="Password" autofocus autocomplete="current-password" />
    <button type="submit" class="primary">Sign in</button>
    <div class="error" id="error"></div>
  </form>
  <script>
    const form = document.getElementById('form');
    const err = document.getElementById('error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('password').value }),
      });
      if (res.ok) { location.href = '/'; }
      else { err.textContent = 'Invalid password'; }
    });
  </script>
</body>
</html>
